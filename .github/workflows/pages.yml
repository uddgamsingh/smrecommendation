name: Deploy UI to GitHub Pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - name: Inject gateway URL (repo variable GATEWAY_URL)
        run: |
          test -n "$GATEWAY_URL" || { echo "Set repo variable GATEWAY_URL"; exit 1; }
          sed -i "s#https://YOUR-GATEWAY-HOST#${GATEWAY_URL%/}#g" config.js index.html
        env: { GATEWAY_URL: "${{ vars.GATEWAY_URL }}" }
      - name: Secret scan (fail if anything key-like is committed)
        run: |
          if grep -R -n -E "(sk-ant-|ghp_|github_pat_|AKIA[0-9A-Z]{16}|ENGINE_API_KEY|X-Internal-Key)" --exclude-dir=.git --exclude-dir=.github . ; then echo "Secret-like string found"; exit 1; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: . }
      - id: d
        uses: actions/deploy-pages@v4
